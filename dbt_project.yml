name: legacy_erp
version: "1.0.0"
profile: legacy_erp
require-dbt-version: [">=1.12.0", "<1.13.0"]

clean-targets:
  - target
  - dbt_packages

flags:
  send_anonymous_usage_stats: false

vars:
  # T13: every raw table has its own currency code mapping. Never reuse one
  # table's mapping for another table. Used by macros/decode_currency.sql.
  currency_codes:
    product_master: {"5": "TRY", "3": "EUR", "1": "USD"}
    stock_movements: {"0": "TRY", "1": "EUR", "2": "USD"}
    account_ledger: {"0": "TRY", "1": "EUR", "2": "USD"}

  # T7: a 120- segment with this many accounts or fewer holds candidate
  # internal counter-accounts. Every candidate needs a row in account_reviews.
  # Used by models/intermediate/int_accounts_classified.sql.
  internal_account_max_segment_size: 2

# Layers: staging and intermediate are views, marts are tables.
# Schema names are used as-is (see macros/generate_schema_name.sql).
models:
  legacy_erp:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

# Raw seeds land in "raw". Hand-maintained reference data (seeds/reference/)
# lands in "reference". The trap manifest overrides this to "answer_key" in
# seeds/_seeds.yml. Every column type is set to varchar there as well.
seeds:
  legacy_erp:
    +schema: raw
    reference:
      +schema: reference
