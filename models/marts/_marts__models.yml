version: 2

# Marts: the public interface. Star schema: wide dimensions describe things,
# narrow facts record events and measurements. Marts select, join and name
# things; every business rule lives in intermediate.
# Every mart has an enforced contract (dbt_project.yml), so every column
# declares its data type. Tests here are structural. Trap tests: step 5.

models:
  - name: dim_products
    description: >
      Products: one row per product in the master. Identity (T15), the
      currency the movements prove (T13), and the latest cost (T2-T5).
    columns:
      - name: product_code
        data_type: varchar
        description: Cleaned product code, the join key (T15).
        data_tests:
          - unique
          - not_null
      - name: product_code_raw
        data_type: varchar
        description: Product code exactly as the ERP stores it, for lineage.
      - name: product_name
        data_type: varchar
        description: Product name.
      - name: product_group_code
        data_type: varchar
        description: "BRG = bearings, SEL = seals, BLT = belts."
      - name: category_code
        data_type: varchar
        description: Category within the group.
      - name: brand
        data_type: varchar
        description: Brand.
      - name: base_code
        data_type: varchar
        description: >
          The code without the brand suffix, and for seals without the
          material (T15). For similarity analysis only, never a join key.
        data_tests:
          - not_null
      - name: base_code_product_count
        data_type: bigint
        description: >
          Products in the same group with the same base code. Above 1 means
          near-duplicates: same size, different brand or material (T15).
        data_tests:
          - not_null
      - name: list_price
        data_type: decimal(18, 4)
        description: List sale price, in sale_currency.
      - name: dealer_price
        data_type: decimal(18, 4)
        description: Dealer sale price, in sale_currency.
      - name: sale_currency
        data_type: varchar
        description: >
          The currency of the prices: the brand's traded currency when it has
          movements, otherwise the master's claim (T13).
        data_tests:
          - not_null
      - name: claimed_currency
        data_type: varchar
        description: The sale currency the master claims. Can be wrong (T13).
      - name: sale_currency_source
        data_type: varchar
        description: "Where sale_currency comes from: movements or master."
      - name: is_currency_flag_wrong
        data_type: boolean
        description: The master's claim differs from the traded currency (T13).
        data_tests:
          - not_null
      - name: latest_cost
        data_type: decimal(18, 8)
        description: >
          Latest cost, in cost_currency: purchase first, then opening row, then
          date, then insert key (T2-T4). NULL when there is no cost source.
      - name: cost_currency
        data_type: varchar
        description: Currency of the latest cost.
      - name: cost_source
        data_type: varchar
        description: "Flow of the latest cost row: purchase or opening."
      - name: cost_date
        data_type: date
        description: Date of the latest cost row.
      - name: latest_adjustment_price
        data_type: decimal(18, 8)
        description: Price of the latest customer adjustment. A reference figure, never a cost (T5).
      - name: adjustment_currency
        data_type: varchar
        description: Currency of the latest customer adjustment.
      - name: adjustment_date
        data_type: date
        description: Date of the latest customer adjustment.

  - name: dim_accounts
    description: >
      Accounts: one row per account. The class (T6-T8) and the trade roles
      from the movements (T6, T9).
    columns:
      - name: account_code
        data_type: varchar
        description: Account code.
        data_tests:
          - unique
          - not_null
      - name: account_name
        data_type: varchar
        description: Account name. Not a reliable way to classify accounts.
      - name: account_prefix
        data_type: varchar
        description: "Structural prefix of the code: 120, 320, A or S."
      - name: account_segment
        data_type: varchar
        description: Middle segment of 120- and 320- codes. NULL for legacy codes.
      - name: segment_size
        data_type: bigint
        description: Number of accounts with the same prefix and segment.
      - name: account_class
        data_type: varchar
        description: >
          end_customer, collector (T8), internal (T7) or trade_partner
          (suppliers and dealers).
        data_tests:
          - not_null
      - name: is_internal_candidate
        data_type: boolean
        description: T7 structural signal. A detector, not a classifier.
      - name: is_reviewed
        data_type: boolean
        description: The account has a human review in account_reviews.
      - name: review_note
        data_type: varchar
        description: The evidence behind the review.
      - name: is_supplier
        data_type: boolean
        description: We buy from this account (purchase or purchase waybill rows).
        data_tests:
          - not_null
      - name: is_dealer
        data_type: boolean
        description: A trade partner that we sell to (T6).
        data_tests:
          - not_null
      - name: is_bidirectional_partner
        data_type: boolean
        description: We both buy from and sell to this partner (T6).
        data_tests:
          - not_null

  - name: fct_sales
    description: >
      Sales: one row per sale line or sale-return line. Invoiced and open
      sales (T1), customer and dealer returns (T9). Internal adjustments (T7)
      and purchase returns (T9) are out. Sales are positive, returns negative:
      sum(sales_amount) is net sales, per currency.
    columns:
      - name: insert_key
        data_type: bigint
        description: Movement row id, the primary key.
        data_tests:
          - unique
          - not_null
      - name: document_number
        data_type: varchar
        description: Document number.
        data_tests:
          - not_null
      - name: document_date
        data_type: date
        description: Document date.
        data_tests:
          - not_null
      - name: product_code
        data_type: varchar
        description: Cleaned product code (T15).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_code
      - name: account_code
        data_type: varchar
        description: The customer, collector or dealer account.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_code
      - name: depot_code
        data_type: varchar
        description: Depot the goods left or came back to.
      - name: flow
        data_type: varchar
        description: "sale_invoice, open_sale (T1), customer_return or dealer_return (T9)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["sale_invoice", "open_sale", "customer_return", "dealer_return"]
      - name: is_sale_return
        data_type: boolean
        description: True for customer and dealer returns.
        data_tests:
          - not_null
      - name: sales_channel
        data_type: varchar
        description: >
          end_customer, collector (T8) or dealer (T6). Revenue counts every
          channel; sales to identifiable end customers count end_customer only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["end_customer", "collector", "dealer"]
      - name: currency
        data_type: varchar
        description: Document currency. Never sum amounts across currencies.
        data_tests:
          - not_null
      - name: unit_price
        data_type: decimal(18, 8)
        description: >
          Unit price in the document currency: per unit, VAT-exclusive, net of
          discount (T14), full stored precision (T16).
      - name: sales_quantity
        data_type: decimal(18, 4)
        description: Quantity. Positive for a sale, negative for a return.
        data_tests:
          - not_null
      - name: sales_amount
        data_type: decimal(38, 12)
        description: >
          Quantity x unit price, VAT-exclusive, in the document currency.
          Positive for a sale, negative for a return.
        data_tests:
          - not_null

  - name: fct_stock_positions
    description: >
      Stock positions today: one row per product in the master. The balance
      view, the depot source and the movement ledger side by side, with the
      status that says which figure differs (T10, T11, T12). No winner is picked.
    columns:
      - name: product_code
        data_type: varchar
        description: Cleaned product code (T15).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_code
      - name: stock_status
        data_type: varchar
        description: >
          no_stock_record, missing_from_balance_view (T10),
          missing_from_depot_source, agree, balance_view_differs,
          depot_source_differs or both_differ (T11).
        data_tests:
          - not_null
      - name: is_in_balance_view
        data_type: boolean
        description: The balance view has a row for the product (T10).
      - name: is_in_depot_source
        data_type: boolean
        description: The depot source has a row for the product.
      - name: has_movements
        data_type: boolean
        description: The product has at least one movement row.
      - name: balance_view_qty
        data_type: decimal(18, 4)
        description: Stock in the balance view. NULL when absent, never 0 (T10).
      - name: depot_source_qty
        data_type: decimal(38, 4)
        description: Stock in the depot source, all its depots together. NULL when absent.
      - name: movement_qty
        data_type: decimal(38, 4)
        description: Sum of signed movement quantities, the ledger's own view.
        data_tests:
          - not_null
      - name: untracked_depot_qty
        data_type: decimal(38, 4)
        description: Movement stock in depots that the depot source has no column for (T12).
      - name: balance_view_gap
        data_type: decimal(38, 4)
        description: balance_view_qty - movement_qty. Positive when the view shows more.
      - name: depot_source_gap
        data_type: decimal(38, 4)
        description: depot_source_qty - movement stock in the depots the source knows.

  - name: fct_sale_invoices
    description: >
      Sale invoices: one row per sale invoice. The total recomputed from the
      lines next to the account ledger (T14), and the total from 2-decimal
      display prices (T16).
    columns:
      - name: document_number
        data_type: varchar
        description: Invoice document number.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales')
                field: document_number
      - name: account_code
        data_type: varchar
        description: Account code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_code
      - name: invoice_date
        data_type: date
        description: Invoice date.
      - name: currency
        data_type: varchar
        description: Invoice currency.
      - name: vat_rate_percent
        data_type: integer
        description: VAT rate in percent.
      - name: line_count
        data_type: bigint
        description: Number of invoice lines.
      - name: net_amount
        data_type: decimal(38, 12)
        description: Sum of line amounts. VAT-exclusive, full precision.
      - name: computed_amount_incl_vat
        data_type: decimal(38, 2)
        description: round(net_amount x (1 + VAT rate), 2). The amount the invoice must have (T14).
        data_tests:
          - not_null
      - name: ledger_amount_incl_vat
        data_type: decimal(18, 2)
        description: Amount in the account ledger. NULL when the ledger has no row.
      - name: is_in_ledger
        data_type: boolean
        description: The account ledger has a row for the invoice.
      - name: amount_difference
        data_type: decimal(38, 2)
        description: ledger_amount_incl_vat - computed_amount_incl_vat (T14).
      - name: display_amount_incl_vat
        data_type: decimal(38, 2)
        description: The same total from prices rounded to 2 decimals (T16).
      - name: display_difference
        data_type: decimal(38, 2)
        description: display_amount_incl_vat - computed_amount_incl_vat (T16).
      - name: has_display_gap
        data_type: boolean
        description: The display-based total differs from the real one (T16).
